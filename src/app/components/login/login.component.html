<main class="login-shell" aria-labelledby="login-title">
  <section class="login-card">
    <div class="login-mark" aria-hidden="true">L</div>
    <p class="login-kicker">LINGARTEN · PANEL PRIVADO</p>
    <h1 id="login-title">Administración</h1>
    <p class="login-copy">
      Acceso reservado para la administración de clientes, servicios y cobros.
    </p>

    <p class="login-error" *ngIf="error" role="alert">{{ error }}</p>

    <button class="login-button" type="button" (click)="signIn()" [disabled]="loading">
      <span class="login-google" aria-hidden="true">G</span>
      <span>{{ loading ? 'Verificando acceso…' : 'Continuar con Google' }}</span>
    </button>

    <p class="login-footnote">Acceso para cuentas administrativas autorizadas.</p>
  </section>
</main>
